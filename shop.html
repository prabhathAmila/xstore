<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pixellers Themes WooCommerce Shop Layouts - Explore interactive filters and templates.">
  <title>E-Commerce Shop Layouts | Pixellers Themes WooCommerce Theme</title>
  <!-- Favicon -->
  <link class="favicon" rel="icon" type="image/png" href="assets/imgs/fevicon.png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@500;700;800&display=swap"
    rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Style CSS -->
  <link rel="stylesheet" href="assets/css/style.css?v=1.2">
  <style>
    /* Standalone page styling keeping the theme system */
    .shop-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
      padding: 40px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .shop-page-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent-dark);
      margin-bottom: 40px;
      text-decoration: none;
      position: relative;
      z-index: 2;
    }

    .shop-page-logo svg {
      color: var(--accent-dark);
    }

    .shop-page-content {
      max-width: 600px;
      background-color: #ffffff;
      padding: 60px 40px;
      border-radius: var(--border-radius-lg);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color-card);
      position: relative;
      z-index: 2;
    }

    .shop-page-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent-dark);
      margin-bottom: 16px;
      letter-spacing: -1px;
    }

    .shop-page-subtitle {
      font-family: var(--font-primary);
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 40px;
      font-weight: 500;
    }

    .shop-page-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      font-weight: 700;
      font-family: var(--font-display);
      font-size: 0.9rem;
      color: #ffffff;
      background-color: var(--accent-dark);
      border-radius: var(--border-radius-sm);
      transition: all var(--transition-fast);
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(30, 32, 36, 0.15);
    }

    .shop-page-btn:hover {
      background-color: var(--accent-dark-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(30, 32, 36, 0.25);
    }

    @media (max-width: 480px) {
      .shop-page-content {
        padding: 40px 20px;
      }

      .shop-page-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body class="light-theme">

  <div class="shop-page-wrapper">
    <a href="index.html" class="shop-page-logo">
      <img src="assets/imgs/fevicon.png" alt="Pixellers Themes Logo" class="logo-icon" width="32" height="32">
      <span class="logo-text">Pixellers</span>
    </a>

    <div class="shop-page-content">
      <h1 class="shop-page-title">Pixellers Themes WooCommerce Shop</h1>
      <p class="shop-page-subtitle">
        Explore our high-converting WooCommerce layout designs, interactive product filters, fast checkout layouts, and
        seamless shopping cart templates. Full e-commerce demonstrations will be accessible here soon.
      </p>
      <a href="index.html" class="shop-page-btn">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Home</span>
      </a>
    </div>
  </div>

</body>

</html>
